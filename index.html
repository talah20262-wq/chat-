<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>WhatsApp Star Ultimate | V6</title>
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22WhatsApp%20Star%22,%22short_name%22:%22Star%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#0b141a%22,%22theme_color%22:%22#202c33%22}">
    <meta name="theme-color" content="#202c33">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/124/124034.png">

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-main: #0b141a;
            --bg-side: #111b21;
            --header: #202c33;
            --green: #00a884;
            --msg-me: #005c4b;
            --msg-other: #202c33;
            --text: #e9edef;
            --gold: #ffd700;
            --ai-blue: #34b7f1;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { height: 100%; margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg-main); color: var(--text); overflow: hidden; }

        /* الشاشات */
        .screen { display: none; height: 100vh; width: 100%; position: absolute; top: 0; left: 0; flex-direction: column; }
        .active { display: flex; }

        /* تسجيل الدخول */
        .auth-bg { background: var(--bg-side); justify-content: center; align-items: center; z-index: 9999; }
        .auth-card { background: var(--header); padding: 30px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid #333; }
        .auth-card h1 { color: var(--green); margin-bottom: 20px; font-size: 24px; }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 12px; border: none; background: #2a3942; color: white; text-align: center; font-size: 16px; outline: none; }
        .btn { padding: 12px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; font-size: 16px; }
        .btn-green { background: var(--green); color: white; }
        .btn-gold { background: transparent; color: var(--gold); border: 1px solid var(--gold); margin-top: 15px; }

        /* القائمة الرئيسية */
        .top-nav { background: var(--header); padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .top-nav .logo { font-size: 20px; font-weight: bold; color: var(--text); }
        .top-nav .icons { display: flex; gap: 20px; font-size: 18px; color: #aebac1; }

        .search-box { padding: 8px 12px; background: var(--bg-main); }
        .search-inner { background: var(--header); border-radius: 8px; display: flex; align-items: center; padding: 0 12px; }
        .search-inner input { background: transparent; text-align: right; margin: 0; padding: 8px; font-size: 14px; }

        .chats-container { flex: 1; overflow-y: auto; background: var(--bg-main); }
        .chat-row { display: flex; align-items: center; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid #222e35; transition: 0.2s; }
        .chat-row:hover { background: #1c282f; }
        .avatar-circle { width: 50px; height: 50px; border-radius: 50%; background: #54656f; margin-left: 15px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .chat-info { flex: 1; }
        .chat-info b { display: block; font-size: 16px; margin-bottom: 4px; }
        .chat-info span { color: #8696a0; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; width: 200px; }

        /* نافذة الدردشة */
        #chat-window { z-index: 5000; background: var(--bg-main); }
        .chat-body { flex: 1; overflow-y: auto; padding: 20px; background: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png'); background-blend-mode: overlay; display: flex; flex-direction: column; gap: 8px; }
        .bubble { max-width: 85%; padding: 8px 12px; border-radius: 8px; font-size: 14.5px; line-height: 1.5; position: relative; word-wrap: break-word; }
        .bubble.me { align-self: flex-end; background: var(--msg-me); border-top-left-radius: 8px; }
        .bubble.other { align-self: flex-start; background: var(--msg-other); border-top-right-radius: 8px; }
        .bubble .sender-name { display: block; font-size: 11px; font-weight: bold; color: var(--gold); margin-bottom: 3px; }

        .input-area { background: var(--header); padding: 10px; display: flex; align-items: center; gap: 10px; }
        .input-area input { flex: 1; background: #2a3942; border-radius: 24px; padding: 12px 18px; text-align: right; margin: 0; }
        .send-btn { background: var(--green); color: white; width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; }

        /* لوحة تحكم المالك */
        #admin-panel { background: #0b141a; border-top: 2px solid var(--gold); padding: 15px; position: fixed; bottom: 0; width: 100%; max-height: 40vh; overflow-y: auto; z-index: 6000; display: none; box-shadow: 0 -5px 15px rgba(0,0,0,0.5); }
        .admin-user-card { display: flex; justify-content: space-between; align-items: center; background: #202c33; padding: 10px; border-radius: 10px; margin-bottom: 8px; }
        .delete-btn { background: #ea0038; color: white; border: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; }

        /* شارات */
        .crown-icon { color: var(--gold); font-size: 14px; margin-right: 5px; }
        .v-badge { color: var(--ai-blue); font-size: 14px; margin-right: 5px; }
    </style>
</head>
<body>

    <div id="screen-auth" class="screen auth-bg active">
        <div class="auth-card">
            <h1><i class="fab fa-whatsapp"></i> WhatsApp Star</h1>
            <input type="text" id="auth-name" placeholder="الاسم المستعار">
            <input type="text" id="auth-phone" placeholder="رقم الهاتف">
            <input type="password" id="auth-pass" placeholder="كلمة السر">
            <textarea id="auth-bio" placeholder="أنا أستخدم واتساب نجم..." rows="2"></textarea>
            <button class="btn btn-green" onclick="registerUser()">إنشاء حساب ودخول فوري</button>
            <button class="btn btn-gold" onclick="openAdminGate()">دخول المالك الملكي 👑</button>
        </div>
    </div>

    <div id="screen-main" class="screen">
        <div class="top-nav">
            <div class="logo">WhatsApp Star</div>
            <div class="icons">
                <i class="fas fa-crown" id="owner-tools" style="display:none; cursor:pointer;" onclick="toggleAdminPanel()"></i>
                <i class="fas fa-sign-out-alt" onclick="logout()" style="cursor:pointer;"></i>
            </div>
        </div>

        <div class="search-box">
            <div class="search-inner">
                <i class="fas fa-search" style="color:#8696a0"></i>
                <input type="text" id="search-input" placeholder="بحث عن شخص..." oninput="search(this.value)">
            </div>
        </div>

        <div class="chats-container">
            <div class="chat-row" onclick="enterChat('global_room', 'الجروب العام')">
                <div class="avatar-circle" style="background:var(--green);"><i class="fas fa-users"></i></div>
                <div class="chat-info">
                    <b>الجروب العام <i class="fas fa-shield-halved v-badge"></i></b>
                    <span>دردشة جماعية لكل النجوم...</span>
                </div>
            </div>
            <div class="chat-row" onclick="enterChat('ai_room', 'Star Gemini AI')">
                <div class="avatar-circle" style="background:var(--ai-blue);"><i class="fas fa-brain"></i></div>
                <div class="chat-info">
                    <b>Star Gemini AI <i class="fas fa-circle-check v-badge"></i></b>
                    <span id="ai-status-text">متصل وجاهز لمساعدتك...</span>
                </div>
            </div>
            <div id="users-list-target"></div>
        </div>
    </div>

    <div id="chat-window" class="screen">
        <div class="top-nav">
            <div style="display:flex; align-items:center; gap:15px">
                <i class="fas fa-arrow-right" onclick="backToMain()" style="cursor:pointer;"></i>
                <b id="active-chat-name"></b>
            </div>
            <i class="fas fa-ellipsis-v"></i>
        </div>
        <div class="chat-body" id="chat-feed"></div>
        <div class="input-area">
            <input type="text" id="chat-input" placeholder="اكتب رسالة...">
            <button class="send-btn" onclick="handleSend()"><i class="fas fa-paper-plane"></i></button>
        </div>
    </div>

    <div id="admin-panel">
        <h3 style="color:var(--gold); margin-bottom:15px;"><i class="fas fa-user-gear"></i> إدارة النجوم</h3>
        <div id="admin-users-render"></div>
    </div>

<script>
    // 1. تكوين الفايربيس (تأكد أن الرابط صحيح)
    const fbConf = { databaseURL: "https://groop-27edc-default-rtdb.europe-west1.firebasedatabase.app/" };
    firebase.initializeApp(fbConf);
    const database = firebase.database();

    // 2. فك تشفير مفتاح Gemini (للحماية من فحص المواقع)
    const _keyEncoded = "QUl6YVN5Ql95enRIOHExdmV3M3ZsekxqLW50eFhNMkxONHRacmJF";
    const _KEY = atob(_keyEncoded);

    let currentUser = JSON.parse(localStorage.getItem('star_v6_user')),
        activePath = "",
        allUsersCache = [];

    // التحقق من الجلسة
    if (currentUser) launch();

    // وظائف الدخول
    function registerUser() {
        const n = document.getElementById('auth-name').value,
              p = document.getElementById('auth-phone').value,
              s = document.getElementById('auth-pass').value,
              b = document.getElementById('auth-bio').value;

        if (!n || !p || !s) return Swal.fire('بيانات ناقصة!');

        database.ref('users/' + p).set({ name: n, phone: p, pass: s, bio: b, role: 'user' }).then(() => {
            currentUser = { name: n, phone: p, role: 'user' };
            localStorage.setItem('star_v6_user', JSON.stringify(currentUser));
            location.reload();
        });
    }

    function openAdminGate() {
        Swal.fire({ title: 'رمز المالك', input: 'password' }).then(res => {
            if (res.value === "2009257mama") {
                currentUser = { name: 'المالك النجم 👑', phone: 'admin_star', role: 'admin' };
                localStorage.setItem('star_v6_user', JSON.stringify(currentUser));
                location.reload();
            }
        });
    }

    function launch() {
        document.getElementById('screen-auth').classList.remove('active');
        document.getElementById('screen-main').classList.add('active');
        
        if (currentUser.role === 'admin') {
            document.getElementById('owner-tools').style.display = 'block';
            loadAdminData();
        }

        database.ref('users').on('value', snap => {
            allUsersCache = [];
            snap.forEach(u => allUsersCache.push(u.val()));
            renderUsers(allUsersCache);
        });
    }

    function renderUsers(list) {
        const container = document.getElementById('users-list-target');
        container.innerHTML = "";
        list.forEach(u => {
            if (u.phone !== currentUser.phone) {
                const room = [currentUser.phone, u.phone].sort().join("_");
                container.innerHTML += `
                    <div class="chat-row" onclick="enterChat('${room}', '${u.name}')">
                        <div class="avatar-circle"><i class="fas fa-user"></i></div>
                        <div class="chat-info">
                            <b>${u.name}</b>
                            <span>${u.bio || 'متوفر في واتساب نجم'}</span>
                        </div>
                    </div>`;
            }
        });
    }

    function enterChat(path, name) {
        activePath = path;
        document.getElementById('active-chat-name').innerText = name;
        document.getElementById('screen-main').classList.remove('active');
        document.getElementById('chat-window').classList.add('active');
        
        database.ref('msgs/' + path).off();
        database.ref('msgs/' + path).on('value', snap => {
            const feed = document.getElementById('chat-feed');
            feed.innerHTML = "";
            snap.forEach(m => {
                const d = m.val();
                const isMe = d.n === currentUser.name;
                feed.innerHTML += `
                    <div class="bubble ${isMe ? 'me' : 'other'}">
                        ${!isMe ? '<span class="sender-name">'+d.n+'</span>' : ''}
                        ${d.b}
                    </div>`;
            });
            feed.scrollTop = feed.scrollHeight;
        });
    }

    async function handleSend() {
        const input = document.getElementById('chat-input');
        const val = input.value.trim();
        if (!val) return;

        database.ref('msgs/' + activePath).push({ n: currentUser.name, b: val });
        input.value = "";

        if (activePath === 'ai_room') {
            document.getElementById('ai-status-text').innerText = "جاري التفكير...";
            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: val }] }] })
                });
                const resData = await response.json();
                const reply = resData.candidates[0].content.parts[0].text;
                database.ref('msgs/ai_room').push({ n: 'Star Gemini AI', b: reply });
            } catch (e) {
                database.ref('msgs/ai_room').push({ n: 'Star Gemini AI', b: 'عذراً، حدث خطأ في معالجة طلبك.' });
            }
            document.getElementById('ai-status-text').innerText = "متصل وجاهز لمساعدتك...";
        }
    }

    function loadAdminData() {
        database.ref('users').on('value', snap => {
            const container = document.getElementById('admin-users-render');
            container.innerHTML = "";
            snap.forEach(u => {
                if (u.val().role !== 'admin') {
                    container.innerHTML += `
                        <div class="admin-user-card">
                            <span>${u.val().name} (${u.val().phone})</span>
                            <button class="delete-btn" onclick="kickUser('${u.key}')">حذف</button>
                        </div>`;
                }
            });
        });
    }

    function kickUser(id) {
        Swal.fire({ title: 'هل أنت متأكد؟', showCancelButton: true }).then(r => {
            if (r.isConfirmed) database.ref('users/' + id).remove();
        });
    }

    function toggleAdminPanel() {
        const p = document.getElementById('admin-panel');
        p.style.display = p.style.display === 'block' ? 'none' : 'block';
    }

    function backToMain() { document.getElementById('chat-window').classList.remove('active'); document.getElementById('screen-main').classList.add('active'); }
    function logout() { localStorage.clear(); location.reload(); }
    function search(v) { renderUsers(allUsersCache.filter(u => u.name.includes(v))); }
</script>
</body>
</html>
